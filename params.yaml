seed: 42
data:
  train_path: data/train.csv
  dvc_file: data/train.csv.dvc
  use_clean: true
features:
  numeric:
  - pm25_today
  - wind_kmph
  - humidity_pct
  - temp_c
  - traffic_index
  - stubble_fires
  categorical:
  - day_type
  - station_zone
  target: pm25_next_day
  drop:
  - record_id
  - date
  - pm25_measured_next_day
split:
  method: time
  date_col: date
  test_size: 0.2
mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: mp221-pm25-next-day
  registered_model_name: mp221-pm25-model
runs:
- name: ridge_baseline
  model: ridge
  params:
    alpha: 1.0
- name: rf_200
  model: random_forest
  params:
    n_estimators: 200
    max_depth: 10
    min_samples_leaf: 2
- name: hgb_default
  model: hist_gb
  params:
    learning_rate: 0.1
    max_iter: 200
- name: hgb_slow
  model: hist_gb
  params:
    learning_rate: 0.05
    max_iter: 400
    max_leaf_nodes: 15
cleaning:
  unit_mixup:
    group_column: station_zone
    group_value: central
    column: pm25_today
    wrong_value_min: 1000
    factor: 1000
  sentinels:
    wind_kmph:
    - 9999
  stuck_sensor:
    minimum_consecutive_dates: 3
