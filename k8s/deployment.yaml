apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp221-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: mp221-api
  template:
    metadata:
      labels:
        app: mp221-api
    spec:
      containers:
        - name: mp221-api
          image: mp221-api:1.0
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
